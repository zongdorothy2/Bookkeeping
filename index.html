<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="記帳本">
    <link rel="apple-touch-icon" href="https://app.yipee.cc/wp-content/uploads/2015/02/932322041.jpg">
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <style>
      :root { --primary-yellow: #FFCC00; --primary-blue: #5BC0DE; --primary-pink: #FF6B6B; --border-dark: #000; }
      * { box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; margin: 0; padding: 0; background: #fff; overflow: hidden; }
      .app-container { display: grid; grid-template-rows: 1fr 75px; height: 100%; width: 100vw; }
      main { overflow: hidden; position: relative; height: 100%; }
      .page { display: none; height: 100%; flex-direction: column; padding: 12px; background: #fff; overflow-y: auto !important; -webkit-overflow-scrolling: touch; }
      .page.active { display: flex; }
      
      .bottom-nav { background: #fff; border-top: 3.5px solid var(--border-dark); display: flex; align-items: center; padding-bottom: env(safe-area-inset-bottom); height: 75px; flex-shrink: 0; }
      .nav-item { flex: 1; text-align: center; color: #888; cursor: pointer; }
      .nav-item.active { color: #000; font-weight: 900; }
      .nav-item p { margin: 0; font-size: 9px; }
      .nav-item span { font-size: 18px; }

      #page-input { padding-bottom: 0; overflow: hidden; } 
      .page-top-fixed { display: flex; flex-direction: column; flex: 1 1 auto; overflow-y: auto; padding-bottom: 8px; }
      
      .input-header-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 15px; flex-shrink: 0; }
      .tab-container { display: flex; background: #eee; border-radius: 10px; padding: 3px; border: 2.5px solid #000; width: fit-content; grid-column: 2; }
      .tab { padding: 4px 20px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
      .tab.active { background: var(--primary-yellow); box-shadow: 2.5px 2.5px 0 #000; }

      .input-meta-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; height: 40px; flex-shrink: 0; }
      #entry-date { border: 2px solid #000; border-radius: 8px; padding: 5px; font-weight: 900; width: 130px; font-size: 13px; height: 32px; }
      .amount-display { font-size: 26px; font-weight: 900; color: #000; letter-spacing: -1px; }
      
      .category-grid.high-density { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px 6px; overflow-y: auto; padding: 10px 5px; border: 1.5px solid #eee; border-radius: 12px; max-height: 38vh; flex-shrink: 0; align-content: start; }
      .cat-item { text-align: center; font-size: 9px; cursor: pointer; }
      .cat-icon { background: #f0f0f0; width: 34px; height: 34px; border-radius: 10px; margin: 0 auto 2px; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; }
      .cat-icon svg { width: 20px; height: 20px; stroke: #555; transition: stroke 0.2s; } 
      .cat-item.active .cat-icon { background: var(--primary-yellow); border-color: #000; box-shadow: 2.2px 2.2px 0 #000; }
      .cat-item.active .cat-icon svg { stroke: #000; stroke-width: 2.5px; } 

      #history-notes-wall { display: flex; overflow-x: auto; gap: 8px; padding: 10px 0; min-height: 40px; flex-shrink: 0; }
      .note-chip { flex-shrink: 0; background: #f8f8f8; border: 1.5px solid #000; border-radius: 15px; padding: 4px 12px; font-size: 11px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
      .note-chip.active { background: var(--primary-yellow); box-shadow: 2px 2px 0 #000; }
      
      #note-input { width: 100%; padding: 10px; border: 2px solid #000; border-radius: 10px; font-size: 14px; margin-top: 5px; flex-shrink: 0; }
      .calculator-grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(4, 1fr); gap: 4px; background: var(--primary-yellow); padding: 10px; border-radius: 15px 15px 0 0; border-top: 4.5px solid #000; margin: auto -12px 0 -12px; height: 34vh; min-height: 200px; flex-shrink: 0; }
      .calculator-grid button { border-radius: 8px; border: 2.5px solid #000; background: #fff; font-weight: 800; font-size: 18px; box-shadow: 0 3px 0 #000; }
      .calculator-grid .ok-btn { grid-column: 5; grid-row: 3 / 5; background: var(--primary-pink); color: #fff; }
      
      .card { flex: 1; padding: 12px; border-radius: 15px; border: 3px solid #000; box-shadow: 3px 3px 0 #000; background: #fff; }
      .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: #ddd; border: 2.5px solid #000; gap: 1px; border-radius: 0 0 12px 12px; }
      .calendar-day { height: 44px; background: #fff; display: flex; align-items: center; justify-content: center; position: relative; font-weight: 900; }
      .calendar-day.selected { background: #FFF9E6; outline: 2.5px solid var(--primary-yellow); z-index: 5; }
      .dot { width: 7px; height: 7px; background: var(--primary-pink); border-radius: 50%; position: absolute; bottom: 5px; border: 1px solid #000; }
      .day-detail-scroll { flex: 1; overflow-y: auto; margin-top: 8px; padding: 12px; background: #FFF9E6; border-radius: 15px; border: 2.5px solid #000; }
      .comp-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 2px solid #000; background: #fff; margin-bottom: 8px; border-radius: 12px; cursor: pointer; }
      
      /* 🚀 右上角浮動同步樣式 */
      .sync-status { position: fixed; top: 12px; right: 12px; background: rgba(0,0,0,0.7); color: #fff; font-size: 10px; padding: 6px 12px; border-radius: 20px; z-index: 5000; display: none; font-weight: bold; backdrop-filter: blur(4px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
      .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 20px; }
      .modal-content { background: #fff; border: 3.5px solid #000; border-radius: 20px; padding: 15px; width: 100%; max-width: 320px; box-shadow: 6px 6px 0 #000; display: flex; flex-direction: column; max-height: 85vh; }
      #drilldown-list { flex: 1; overflow-y: auto !important; -webkit-overflow-scrolling: touch; padding-right: 5px; margin-top: 10px; }
      .today-btn { background: #000; color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 11px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 5px; }
      .spinning { animation: spin 0.8s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .trend-container { background: #f9f9f9; border: 3px solid #000; border-radius: 15px; padding: 15px; margin-bottom: 20px; box-shadow: 4px 4px 0 #000; }
      .trend-header { font-weight: 900; font-size: 18px; margin-bottom: 10px; border-left: 6px solid var(--primary-yellow); padding-left: 10px; }
      .year-nav { display: flex; align-items: center; gap: 15px; justify-content: center; }
      .nav-arrow { background: #000; color: #fff; border: none; border-radius: 6px; padding: 4px 12px; font-weight: bold; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="loader" style="position:fixed; inset:0; background:#fff; display:flex; justify-content:center; align-items:center; z-index:9999;"><p style="font-weight:bold;">旗艦系統啟動中...</p></div>
    <div id="sync-indicator" class="sync-status">☁️ 雲端同步中...</div>

    <div id="drilldown-modal" class="modal-overlay"><div class="modal-content"><div style="display:flex; justify-content:space-between; align-items:center; flex-shrink:0;"><h3 id="drilldown-title" style="margin:0;">分析明細</h3><button style="border:none; background:none; font-size:20px; font-weight:bold;" onclick="closeDrilldown()">✕</button></div><div id="drilldown-list"></div></div></div>
    <div id="edit-modal" class="modal-overlay"><div class="modal-content"><h3 style="flex-shrink:0;">✏️ 編輯帳務</h3><input type="hidden" id="edit-id"><input type="hidden" id="edit-old-date"><label>日期</label><input type="date" id="edit-date" style="width:100%; margin-bottom:5px;"><label>分類</label><select id="edit-category" style="width:100%; margin-bottom:5px;"></select><label>金額</label><input type="number" id="edit-amount" style="width:100%; margin-bottom:5px;"><label>備註</label><input type="text" id="edit-note" style="width:100%; margin-bottom:10px;"><div style="display:flex; flex-direction:column; gap:8px; flex-shrink:0;"><button style="background:var(--primary-yellow); padding:10px; border:2px solid #000; font-weight:bold;" onclick="saveEdit()">儲存修改</button><div style="display:flex; gap:8px;"><button style="flex:1; padding:10px; border:2px solid #000;" onclick="closeEditModal()">取消</button><button style="flex:1; background:var(--primary-pink); color:white; padding:10px; border:2px solid #000;" onclick="deleteEntry()">刪除</button></div></div></div></div>

    <div class="app-container">
      <main id="main-content">
        <section id="page-overview" class="page">
          <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;"><button class="nav-arrow" onclick="changeOvMonth(-1)">◀</button><h2 id="overview-month-title">...</h2><button class="nav-arrow" onclick="changeOvMonth(1)">▶</button></header>
          <div style="display:flex; justify-content:space-between; gap:10px; margin-bottom:20px;"><div class="card"><small>支出</small><div id="ov-total-expense" style="font-weight:900;">$0</div></div><div class="card"><small>收入</small><div id="ov-total-income" style="font-weight:900;">$0</div></div></div>
          <div style="width:240px; height:240px; margin:0 auto; position:relative;"><canvas id="overviewChart"></canvas><div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center;"><small>結餘</small><div id="ov-balance" style="font-weight:900; font-size:20px;">$0</div></div></div>
        </section>

        <section id="page-input" class="page active">
          <div class="page-top-fixed">
            <div class="input-header-row">
              <div class="tab-container"><div class="tab active" id="tab-expense" onclick="switchType('支出')">支出</div><div class="tab" id="tab-income" onclick="switchType('收入')">收入</div></div>
            </div>
            <div class="input-meta-row"><input type="date" id="entry-date"><div id="display-amount" class="amount-display">$ 0</div></div>
            <div class="category-grid high-density" id="category-list"></div>
            <div id="history-notes-wall"></div>
            <input type="text" id="note-input" placeholder="選擇分類或輸入備註..." oninput="syncNoteActiveState()">
          </div>
          <div class="calculator-grid">
            <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="op" onclick="press('/')">÷</button><button onclick="clearCalc()">AC</button>
            <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="op" onclick="press('*')">×</button><button onclick="backspace()">←</button>
            <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="op" onclick="press('+')">+</button><button class="ok-btn" onclick="submitData()">OK</button>
            <button onclick="press('00')">00</button><button onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="op" onclick="press('-')">-</button>
          </div>
        </section>

        <section id="page-calendar" class="page"><div class="calendar-fixed-top"><div style="display:flex; justify-content:space-between; align-items:center; height:45px; margin-bottom:5px;"><button class="nav-arrow" onclick="changeMonth(-1)">◀</button><div style="display:flex; align-items:center;"><h2 id="calendar-title" style="margin:0">...</h2><button class="today-btn" onclick="goToday()">今</button></div><button class="nav-arrow" onclick="changeMonth(1)">▶</button><button id="manual-sync-btn" onclick="manualSync()" style="background:var(--primary-blue); color:#fff; border:2px solid #000; border-radius:8px; width:30px; height:30px">🔄</button></div><div style="display:flex; justify-content:space-around; background:#fcfcfc; border:2px solid #000; border-bottom:none; border-radius:12px 12px 0 0; padding:8px 0;"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div><div id="calendar-grid" class="calendar-grid" onclick="handleCalClick(event)"></div></div><div id="day-detail" class="day-detail-scroll"></div></section>
        <section id="page-report" class="page"><div style="padding:10px; border:2px solid #000; border-radius:15px; background:#f9f9f9; margin-bottom:15px; flex-shrink:0;"><div style="margin-bottom:5px;"><small>🏁 基準 A (上個月)</small><br><input type="date" id="range-a-start" style="width:45%"> 至 <input type="date" id="range-a-end" style="width:45%"></div><div style="margin-bottom:5px;"><small>📊 比較 B (這個月)</small><br><input type="date" id="range-b-start" style="width:45%"> 至 <input type="date" id="range-b-end" style="width:45%"></div><button onclick="renderReport(true)" style="width:100%; margin-top:10px; padding:10px; background:var(--primary-yellow); font-weight:bold; border:2px solid #000">執行分析</button></div><div style="height:250px; flex-shrink:0;"><canvas id="pieChart"></canvas></div><div id="comparison-list" style="margin-top:10px;"></div></section>
        <section id="page-trend" class="page"><header style="margin-bottom:20px;" class="year-nav"><button class="nav-arrow" onclick="changeTrendYear(-1)">◀</button><h2 id="trend-year-title" style="margin:0; border-bottom:4px solid var(--primary-yellow);">... 年度趨勢</h2><button class="nav-arrow" onclick="changeTrendYear(1)">▶</button></header><div class="trend-container" style="height:350px; padding:15px;"><div class="trend-header">收支走勢圖</div><div style="height:280px;"><canvas id="lineChart"></canvas></div></div><div id="trend-summary-list"></div></section>
      </main>
      <nav class="bottom-nav">
        <div class="nav-item" onclick="navTo('page-overview', this)"><span>🏠</span><p>概覽</p></div>
        <div class="nav-item active" onclick="navTo('page-input', this)"><span>✏️</span><p>記帳</p></div>
        <div class="nav-item" onclick="navTo('page-calendar', this)"><span>📅</span><p>月曆</p></div>
        <div class="nav-item" onclick="navTo('page-report', this)"><span>📊</span><p>報表</p></div>
        <div class="nav-item" onclick="navTo('page-trend', this)"><span>📈</span><p>趨勢</p></div>
      </nav>
    </div>

    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbxMXDaP4zWIBnAb3SivBVnaEnkf5NiJwVYzbraeZvxNLcHr7QAbCfJr6SrE8g90CQJkHQ/exec";
      let currentAmount = "0", selectedType = "支出", selectedCategory = "";
      let allRecords = [], categories = {"支出":[], "收入":[]}, historyNotes = {};
      let loadedYears = new Set(), isSubmitting = false, selectedDayStr = "";
      let chartInstance = null, overviewChart = null, lineChart = null, calDate = new Date(), ovDate = new Date(), trendDate = new Date();

      function getTaiwanToday() { return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Taipei' }).format(new Date()); }
      function getCategoryIcon(name) {
        const icons = {
          "早餐": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>`,
          "午餐": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11c0-1.7 1.3-3 3-3h12c1.7 0 3 1.3 3 3v2H3v-2z"></path><path d="M3 13v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6"></path><path d="M12 5V3"></path></svg>`,
          "晚餐": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 2v20"></path><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></svg>`,
          "菜市場": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 11 3-9h14l3 9"></path><path d="M3 11v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V11"></path><path d="M9 11v4"></path><path d="M15 11v4"></path></svg>`,
          "大全聯": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path></svg>`,
          "飲品點心": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12l-1.5 7h-9L6 11z"></path><path d="M12 11V5a2 2 0 0 1 2-2h1"></path><path d="M6 11V9a4 4 0 0 1 8 0v2"></path></svg>`,
          "交通": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><circle cx="17" cy="17" r="2"></circle></svg>`,
          "購物": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>`,
          "醫療": `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>`,
          "娛樂": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 12h4"></path><path d="M8 10v4"></path><path d="M15 13h.01"></path><path d="M18 11h.01"></path></svg>`,
          "每月固定支出": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M7 14h.01"></path><path d="M17 14h.01"></path><path d="M7 18h.01"></path><path d="M17 18h.01"></path></svg>`,
          "水電瓦斯": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"></path><path d="M18.4 14.6a8 8 0 1 1-12.8 0"></path><path d="M12 22v-4"></path><path d="m15 7-3-3-3 3"></path></svg>`,
          "其他": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>`,
          "丁丁藥局": `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path><path d="m8.5 8.5 7 7"></path></svg>`
        };
        return icons[name] || "📂";
      }

      window.onload = () => {
        setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 2000);
        const today = getTaiwanToday();
        document.getElementById('entry-date').value = today;
        selectedDayStr = today;
        const now = new Date();
        document.getElementById('range-a-start').value = new Date(now.getFullYear(), now.getMonth() - 1, 1).toISOString().split('T')[0];
        document.getElementById('range-a-end').value = new Date(now.getFullYear(), now.getMonth(), 0).toISOString().split('T')[0];
        document.getElementById('range-b-start').value = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
        document.getElementById('range-b-end').value = today;
        const currentYear = today.substring(0, 4);
        document.getElementById('trend-year-title').innerText = `${currentYear} 年度趨勢`;
        const cachedCats = localStorage.getItem('archie_cats');
        const cachedRecords = localStorage.getItem('archie_records_' + currentYear);
        if (cachedCats && cachedRecords) {
          categories = JSON.parse(cachedCats); allRecords = JSON.parse(cachedRecords);
          historyNotes = JSON.parse(localStorage.getItem('archie_notes') || '{}');
          selectedCategory = categories[selectedType][0] || "";
          renderCategories(); updateViews();
          document.getElementById('loader').style.display = 'none';
          syncYearData(currentYear, false);
        } else { syncYearData(currentYear, true); }
      };

      function formatAmountDisplay(val) { return (val === "0") ? "$ 0" : "$ " + val.replace(/\d+/g, (m) => Number(m).toLocaleString()); }
      function syncYearData(year, forceRefresh) { if(!forceRefresh) document.getElementById('sync-indicator').style.display = 'block'; fetch(`${API_URL}?year=${year}&force=${forceRefresh}&t=${Date.now()}`).then(res => res.json()).then(data => { if(data.status === "success") { if(data.categories) { categories = data.categories; localStorage.setItem('archie_cats', JSON.stringify(categories)); } if(data.historyNotes) { historyNotes = data.historyNotes; localStorage.setItem('archie_notes', JSON.stringify(historyNotes)); } const valid = (data.records || []).filter(r => r && r.ID); allRecords = allRecords.filter(r => !r.日期.startsWith(year)); allRecords.push(...valid); localStorage.setItem('archie_records_' + year, JSON.stringify(valid)); loadedYears.add(year); if(!selectedCategory) selectedCategory = categories[selectedType][0]; renderCategories(); updateViews(); } document.getElementById('sync-indicator').style.display = 'none'; }).catch(() => { document.getElementById('sync-indicator').style.display = 'none'; }); }
      function press(v) { currentAmount = (currentAmount === "0") ? v : currentAmount + v; document.getElementById('display-amount').innerText = formatAmountDisplay(currentAmount); }
      function clearCalc() { currentAmount = "0"; document.getElementById('display-amount').innerText = "$ 0"; }
      function backspace() { currentAmount = currentAmount.slice(0,-1) || "0"; document.getElementById('display-amount').innerText = formatAmountDisplay(currentAmount); }
      function goToday() { const today = new Date(); calDate = new Date(today.getFullYear(), today.getMonth(), 1); selectedDayStr = getTaiwanToday(); initCalendar(); }
      
      // 🚀 智慧清空與重繪標籤
      function selectCat(c) { 
        selectedCategory = c; 
        document.getElementById('note-input').value = ""; 
        renderCategories(); 
        renderHistoryNotes(); 
      }

      function renderCategories() { const currentCats = categories[selectedType] || ["一般"]; document.getElementById('category-list').innerHTML = currentCats.map(c => `<div class="cat-item ${selectedCategory===c?'active':''}" onclick="selectCat('${c}')"><div class="cat-icon">${getCategoryIcon(c)}</div><div class="cat-label">${c}</div></div>`).join(''); renderHistoryNotes(); }
      
      function renderHistoryNotes() {
        const notes = historyNotes[selectedCategory] || [];
        const container = document.getElementById('history-notes-wall');
        if (notes.length === 0) { container.style.display = "none"; return; }
        container.style.display = "flex";
        const currentVal = document.getElementById('note-input').value;
        container.innerHTML = notes.map(text => `<div class="note-chip ${text === currentVal ? 'active' : ''}" onclick="selectNoteChip(this, '${text}')">${text}</div>`).join('');
      }

      function selectNoteChip(el, text) { document.getElementById('note-input').value = text; syncNoteActiveState(); }
      function syncNoteActiveState() { const currentVal = document.getElementById('note-input').value; document.querySelectorAll('.note-chip').forEach(chip => { chip.classList.toggle('active', chip.innerText === currentVal); }); }
      function changeTrendYear(offset) { trendDate.setFullYear(trendDate.getFullYear() + offset); const targetYear = trendDate.getFullYear().toString(); document.getElementById('trend-year-title').innerText = `${targetYear} 年度趨勢`; if (!loadedYears.has(targetYear)) syncYearData(targetYear, false); else renderTrend(); }
      function renderTrend() { if (typeof Chart === 'undefined') return; const viewYear = trendDate.getFullYear().toString(); const monthlyExp = new Array(12).fill(0), monthlyInc = new Array(12).fill(0); allRecords.forEach(r => { if (r && r.日期 && r.日期.startsWith(viewYear)) { const month = parseInt(r.日期.split('-')[1]) - 1; if (r.類型 === '支出') monthlyExp[month] += Number(r.金額); else if (r.類型 === '收入') monthlyInc[month] += Number(r.金額); } }); const ctx = document.getElementById('lineChart').getContext('2d'); if (lineChart) lineChart.destroy(); lineChart = new Chart(ctx, { type: 'line', data: { labels: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'], datasets: [ { label: '收入', data: monthlyInc, borderColor: '#5BC0DE', backgroundColor: 'rgba(91,192,222,0.1)', borderWidth: 3, tension: 0.4, fill: true }, { label: '支出', data: monthlyExp, borderColor: '#FFCC00', backgroundColor: 'rgba(255,204,0,0.1)', borderWidth: 3, tension: 0.4, fill: true } ] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } } }); document.getElementById('trend-summary-list').innerHTML = monthlyExp.map((exp, i) => { if (exp === 0 && monthlyInc[i] === 0) return ''; return `<div class="comp-row"><span><b>${i+1}月</b></span><span><small>收</small> <b style="color:#5BC0DE;">$${monthlyInc[i].toLocaleString()}</b> / <small>支</small> <b style="color:#FF6B6B;">$${exp.toLocaleString()}</b></span></div>`; }).join(''); }
      async function submitData() { if (isSubmitting) return; let amt; try { const sanitized = currentAmount.replace(/×/g, '*').replace(/÷/g, '/').replace(/[^0-9+\-*/.]/g, ''); amt = Number(new Function(`return (${sanitized})`)()); } catch (e) { return alert("計算錯誤"); } if (isNaN(amt) || amt <= 0) return alert("金額錯誤"); isSubmitting = true; const okBtn = document.querySelector('.ok-btn'); okBtn.disabled = true; okBtn.innerText = "⌛"; const dateStr = document.getElementById('entry-date').value; const uniqueId = "TX" + Date.now(); const localData = { "ID": uniqueId, "日期": dateStr, "類型": selectedType, "分類": selectedCategory, "金額": amt, "備註": document.getElementById('note-input').value }; allRecords.push(localData); localStorage.setItem('archie_records_' + dateStr.substring(0,4), JSON.stringify(allRecords.filter(r => r.日期.startsWith(dateStr.substring(0,4))))); updateViews(); clearCalc(); document.getElementById('note-input').value = ""; try { const params = new URLSearchParams({ action:'add', id:uniqueId, date:dateStr, type:selectedType, category:selectedCategory, amount:amt, note:localData.備註, t:Date.now() }); await fetch(`${API_URL}?${params.toString()}`); syncYearData(dateStr.substring(0,4), true); } finally { isSubmitting = false; okBtn.disabled = false; okBtn.innerText = "OK"; } }
      function updateViews() { const active = document.querySelector('.page.active').id; if(active==='page-overview') renderOverview(); if(active==='page-calendar') initCalendar(); if(active==='page-report') renderReport(false); if(active==='page-trend') renderTrend(); }
      function handleCalClick(e) { const dayEl = e.target.closest('.calendar-day'); if(!dayEl || dayEl.classList.contains('empty')) return; selectedDayStr = dayEl.getAttribute('data-date'); document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected')); dayEl.classList.add('selected'); showDayDetail(selectedDayStr); }
      function showDayDetail(ds) { const detail = document.getElementById('day-detail'); const daily = allRecords.filter(r => r && r.日期 === ds); if(daily.length === 0) return detail.innerHTML = `<p style="color:#999;text-align:center;padding:20px;">${ds}<br>無紀錄</p>`; detail.innerHTML = daily.map(r => `<div class="detail-item" style="padding:10px; border-bottom:1px solid #ddd; background:#fff; margin-bottom:5px; border-radius:8px;" onclick='openEditModal("${r.ID}")'><span style="font-weight:bold;">• ${r.分類}</span><span style="color:${r.類型==='支出'?'#FF6B6B':'#4DB6AC'}; font-weight:900; float:right;">$${Number(r.金額).toLocaleString()}</span>${r.備註 ? `<div style="font-size:12px;color:#666;">↳ ${r.備註}</div>` : ""}</div>`).join(''); }
      function openEditModal(id) { const record = allRecords.find(r => r && String(r.ID) === String(id)); if(!record) return; document.getElementById('edit-id').value = record.ID; document.getElementById('edit-old-date').value = record.日期; document.getElementById('edit-date').value = record.日期; document.getElementById('edit-amount').value = record.金額; document.getElementById('edit-note').value = record.備註 || ""; const type = record.類型 || "支出"; document.getElementById('edit-category').innerHTML = (categories[type] || ["一般"]).map(c => `<option value="${c}" ${c === record.分類 ? 'selected' : ''}>${c}</option>`).join(''); document.getElementById('edit-modal').style.display = 'flex'; }
      async function saveEdit() { const id = document.getElementById('edit-id').value, oldDate = document.getElementById('edit-old-date').value; const originalRecord = allRecords.find(r => r && String(r.ID) === String(id)); const recordType = originalRecord ? originalRecord.類型 : "支出"; const data = { date: document.getElementById('edit-date').value, category: document.getElementById('edit-category').value, amount: Number(document.getElementById('edit-amount').value), note: document.getElementById('edit-note').value, type: recordType }; closeEditModal(); document.getElementById('sync-indicator').style.display = 'block'; const params = new URLSearchParams({ action:'update', id, oldDate, ...data, t:Date.now() }); await fetch(`${API_URL}?${params.toString()}`); syncYearData(data.date.substring(0,4), true); if(oldDate.substring(0,4) !== data.date.substring(0,4)) syncYearData(oldDate.substring(0,4), true); }
      async function deleteEntry() { const id = document.getElementById('edit-id').value, date = document.getElementById('edit-old-date').value; if(!confirm("確定刪除？")) return; closeEditModal(); document.getElementById('sync-indicator').style.display = 'block'; const params = new URLSearchParams({ action:'delete', id, date, t:Date.now() }); await fetch(`${API_URL}?${params.toString()}`); syncYearData(date.substring(0,4), true); }
      function navTo(id, el) { document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); el.classList.add('active'); updateViews(); }
      function switchType(t) { selectedType = t; document.getElementById('tab-expense').classList.toggle('active', t==='支出'); document.getElementById('tab-income').classList.toggle('active', t==='收入'); selectedCategory = categories[t] ? categories[t][0] : ""; renderCategories(); }
      function manualSync() { const btn = document.getElementById('manual-sync-btn'); btn.classList.add('spinning'); const yearToSync = (selectedDayStr || getTaiwanToday()).substring(0,4); syncYearData(yearToSync, true); setTimeout(()=>btn.classList.remove('spinning'),1000); }
      function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; }
      function closeDrilldown() { document.getElementById('drilldown-modal').style.display = 'none'; }
      function changeMonth(s) { calDate.setMonth(calDate.getMonth() + s); initCalendar(); }
      function changeOvMonth(s) { ovDate.setMonth(ovDate.getMonth()+s); renderOverview(); }
      function initCalendar() { const grid = document.getElementById('calendar-grid'); const y = calDate.getFullYear(), m = calDate.getMonth(); document.getElementById('calendar-title').innerText = `${y}年 ${m + 1}月`; let offset = (new Date(y, m, 1).getDay() || 7) - 1; const days = new Date(y, m + 1, 0).getDate(), expenseDays = new Set(), monthPrefix = `${y}-${String(m+1).padStart(2,'0')}`; allRecords.forEach(r => { if(r && r.日期 && r.日期.startsWith(monthPrefix) && r.類型 === '支出') expenseDays.add(r.日期); }); let html = ""; for(let i=0; i<offset; i++) html += `<div class='calendar-day empty'></div>`; for(let d=1; d<=days; d++) { const ds = `${monthPrefix}-${String(d).padStart(2,'0')}`, isSelected = (ds === selectedDayStr) ? 'selected' : '', hasDot = expenseDays.has(ds) ? '<div class="dot"></div>' : ''; html += `<div class="calendar-day ${isSelected}" data-date="${ds}"><span>${d}</span>${hasDot}</div>`; } grid.innerHTML = html; showDayDetail(selectedDayStr); }
      function renderOverview() { if (typeof Chart === 'undefined') return; const y = ovDate.getFullYear(), m = String(ovDate.getMonth() + 1).padStart(2, '0'); document.getElementById('overview-month-title').innerText = `${y}年 ${parseInt(m)}月`; let tE = 0, tI = 0; allRecords.forEach(r => { if (r && r.日期 && r.日期.startsWith(`${y}-${m}`)) { if (r.類型 === '支出') tE += Number(r.金額); else if (r.類型 === '收入') tI += Number(r.金額); } }); document.getElementById('ov-total-expense').innerText = `$${tE.toLocaleString()}`; document.getElementById('ov-total-income').innerText = `$${tI.toLocaleString()}`; document.getElementById('ov-balance').innerText = `$${(tI - tE).toLocaleString()}`; const ctx = document.getElementById('overviewChart').getContext('2d'); if(overviewChart) overviewChart.destroy(); overviewChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['總支出', '剩餘結餘'], datasets: [{ data: [tE, Math.max(0, tI - tE)], backgroundColor: ['#FFCC00', '#5BC0DE'], borderWidth: 3 }] }, options: { cutout: '75%', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } }); }
      async function renderReport(isUserTriggered = true) { if (typeof Chart === 'undefined') return; const sA = document.getElementById('range-a-start').value, eA = document.getElementById('range-a-end').value, sB = document.getElementById('range-b-start').value, eB = document.getElementById('range-b-end').value; if(!sA || !eA || !sB || !eB) return; const sumA = {}, sumB = {}; allRecords.forEach(r => { if(r && r.類型 === '支出') { const c = r.分類; if (r.日期 >= sA && r.日期 <= eA) sumA[c] = (sumA[c] || 0) + Number(r.金額); if (r.日期 >= sB && r.日期 <= eB) sumB[c] = (sumB[c] || 0) + Number(r.金額); } }); const ctx = document.getElementById('pieChart').getContext('2d'); if(chartInstance) chartInstance.destroy(); chartInstance = new Chart(ctx, { type: 'doughnut', data: { labels: Object.keys(sumB), datasets: [{ data: Object.values(sumB), backgroundColor: ['#FF6B6B','#FFCC00','#5BC0DE','#9575CD','#4DB6AC','#FF8A65','#FABEBE','#3CB44B'] }] }, options: { responsive: true, maintainAspectRatio: false, onClick: (e, el) => { if(el.length > 0) openDrilldown(chartInstance.data.labels[el[0].index], sB, eB); } } }); document.getElementById('comparison-list').innerHTML = Array.from(new Set([...Object.keys(sumA), ...Object.keys(sumB)])).sort((a,b) => (sumB[b]||0) - (sumB[a]||0)).map(cat => { const vA = sumA[cat] || 0, vB = sumB[cat] || 0, diff = vB - vA; return `<div class="comp-row" onclick="openDrilldown('${cat}', '${sB}', '${eB}')"><span>${cat}</span><span>$${vB.toLocaleString()} (${diff > 0 ? '🔺' : '🔹'}$${Math.abs(diff).toLocaleString()})</span></div>`; }).join(''); }
      function openDrilldown(cat, s, e) { document.getElementById('drilldown-title').innerText = `🔍 ${cat} 明細`; document.getElementById('drilldown-list').innerHTML = allRecords.filter(r => r && r.分類 === cat && r.日期 >= s && r.日期 <= e).map(r => `<div style="padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;"><div><b>${r.日期}</b><br><small style="color:#666;">${r.備註||"無"}</small></div><b style="color:#FF6B6B;">$${Number(r.金額).toLocaleString()}</b></div>`).join(''); document.getElementById('drilldown-modal').style.display = 'flex'; }
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { const today = getTaiwanToday(); const dateInput = document.getElementById('entry-date'); if (dateInput && dateInput.value !== today) { dateInput.value = today; selectedDayStr = today; const currentYear = today.substring(0, 4); if (!loadedYears.has(currentYear)) syncYearData(currentYear, false); } } });
    </script>
  </body>
</html>
